name: MusicPractice
options:
  bundleIdPrefix: com.grusellstorvreta
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
targets:
  MusicPractice:
    type: application
    platform: iOS
    sources:
      - path: MusicPractice
      - path: Shared
    info:
      path: MusicPractice/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSSupportsLiveActivities: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grusellstorvreta.MusicPractice
        PRODUCT_NAME: MusicPractice
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: MusicPracticeWidgetExtension
        embed: true
  MusicPracticeWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: MusicPracticeWidget
      - path: Shared
    info:
      path: MusicPracticeWidget/Info.plist
      properties:
        CFBundleDisplayName: MusicPractice Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grusellstorvreta.MusicPractice.WidgetExtension
        PRODUCT_NAME: MusicPracticeWidgetExtension
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: false
schemes:
  MusicPractice:
    build:
      targets:
        MusicPractice: all
        MusicPracticeWidgetExtension: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
